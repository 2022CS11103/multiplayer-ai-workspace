name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: pytest -q
      - name: Eval
        working-directory: ${{ github.workspace }}
        run: python eval/run.py
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/REPORT.md

  postgres-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maw
          POSTGRES_PASSWORD: maw
          POSTGRES_DB: maw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maw -d maw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://maw:maw@localhost:5432/maw
      DB_AUTO_CREATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Upgrade
        run: alembic upgrade head
      - name: No drift between models and migrations
        run: alembic check
      - name: Seed demo
        run: python -m app.seed && python -m app.seed
      - name: Downgrade and re-upgrade
        run: alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Compose config is valid
        run: docker compose config -q
      - name: Build images
        run: docker compose build
      - name: Boot the stack and smoke-test
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/ready; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/ready
          curl -fsS -o /dev/null http://localhost:3000
          curl -fsS -X POST http://localhost:8000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ananya@example.com","password":"forge-demo-2026"}' | grep -q token
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
